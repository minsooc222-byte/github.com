<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>고사성어 퀴즈</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Pretendard:wght@400;600;700&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
        }

        .hanzi {
            font-family: 'Noto Serif KR', serif;
        }

        input {
            -webkit-user-select: text;
            user-select: text;
        }

        @media (orientation: portrait) {
            body {
                align-items: flex-start;
                padding-top: 12px;
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-2 sm:p-4">

<main class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-4 border border-slate-200">

    <!-- ============================= -->
    <!-- 1. 설정 영역 -->
    <!-- ============================= -->

    <div id="setup-section" class="space-y-4">

        <h1 class="text-2xl font-bold text-center text-slate-900">
            고사성어 퀴즈
        </h1>

        <p class="text-center text-xs text-slate-500">
            고사성어를 보고 독음을 입력하세요.
        </p>


        <!-- 범위 선택 -->

        <div>

            <label class="block text-xs font-bold text-slate-600 mb-1">
                범위 선택 (여러 개 선택 가능)
            </label>

            <div id="range-grid" class="grid grid-cols-5 gap-1.5"></div>

            <p class="text-xs text-slate-400 mt-2">
                여러 범위를 동시에 선택할 수 있습니다.
            </p>

        </div>


        <!-- 선택 범위 표시 -->

        <div
            id="selected-range-text"
            class="text-center text-xs font-semibold text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-lg py-2"
        >
            선택 범위: 1~10
        </div>


        <!-- 시작 버튼 -->

        <button
            type="button"
            onclick="startQuiz()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition text-base"
        >
            퀴즈 시작하기
        </button>

    </div>



    <!-- ============================= -->
    <!-- 2. 퀴즈 영역 -->
    <!-- ============================= -->

    <div id="quiz-section" class="hidden space-y-3">

        <!-- 상단 바 -->

        <div class="flex justify-between items-center text-xs font-semibold text-slate-500 border-b pb-2">

            <button
                onclick="resetSetup()"
                class="text-slate-400 hover:text-slate-600"
            >
                ← 처음으로
            </button>

            <span id="progress-text">
                문제 1 / 10
            </span>

            <span
                id="score-text"
                class="text-indigo-600 font-bold"
            >
                점수: 0점
            </span>

        </div>



        <!-- 좌 / 우 분할 -->

        <div class="grid grid-cols-12 gap-4 items-center py-2">


            <!-- ============================= -->
            <!-- 왼쪽: 한자 -->
            <!-- ============================= -->

            <div
                class="col-span-5 text-center border-r pr-4 border-slate-100 flex flex-col justify-center min-h-[160px]"
            >

                <div
                    id="hanzi-display"
                    class="hanzi text-4xl sm:text-5xl font-black text-slate-900 tracking-wider mb-2 leading-none"
                >
                    ---
                </div>


                <!-- 정답 확인 후 의미 -->

                <div
                    id="meaning-hint-box"
                    class="hidden bg-indigo-50 p-2 rounded-lg border border-indigo-100 text-xs text-indigo-900 font-medium"
                >

                    <span id="meaning-hint-text">
                        의미 영역
                    </span>

                </div>

            </div>



            <!-- ============================= -->
            <!-- 오른쪽: 입력 -->
            <!-- ============================= -->

            <div class="col-span-7 space-y-2 pl-2">


                <p
                    id="mode-hint"
                    class="text-xs text-slate-500 font-medium"
                >
                    고사성어의 독음을 입력하세요.
                </p>


                <div class="flex gap-2">

                    <input
                        type="text"
                        id="answer-input"
                        placeholder="독음 입력 (Enter)"
                        class="flex-1 px-3 py-2.5 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-indigo-600 text-base font-medium"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >


                    <button
                        id="action-btn"
                        onclick="handleAction()"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl transition text-base whitespace-nowrap min-w-[90px]"
                    >
                        확인
                    </button>

                </div>


                <!-- 피드백 -->

                <div
                    id="feedback"
                    class="h-8 flex items-center justify-center font-bold text-sm rounded-lg"
                ></div>

            </div>

        </div>

    </div>



    <!-- ============================= -->
    <!-- 3. 결과 영역 -->
    <!-- ============================= -->

    <div
        id="result-section"
        class="hidden text-center space-y-4 py-4"
    >

        <h2 class="text-xl font-bold text-slate-900">
            퀴즈 완료!
        </h2>


        <div
            class="text-4xl font-extrabold text-indigo-600"
            id="final-score"
        >
            0 / 100점
        </div>


        <p
            id="result-message"
            class="text-slate-600 text-sm"
        >
            수고하셨습니다!
        </p>


        <button
            onclick="resetSetup()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl shadow"
        >
            다시 하기
        </button>

    </div>

</main>

    { id: 97, hanzi: "口蜜腹劍", reading: "구밀복검", meaning: "입 구 꿀 밀 배 복 칼 검" },
    { id: 98, hanzi: "騎虎之勢", reading: "기호지세", meaning: "말탈 기 범 호 갈 지 형세 세" },
    { id: 99, hanzi: "獨不將軍", reading: "독불장군", meaning: "홀로 독 아닐 불 장수 장 군사 군" },
    { id: 100, hanzi: "面從腹背", reading: "면종복배", meaning: "낯 면 좇을 종 배 복 등질 배" }

];



/* =========================================================
   상태 변수
   ========================================================= */

let selectedRanges = new Set([0]);

let activeQuestions = [];

let currentIndex = 0;

let score = 0;

let isAnswerChecked = false;



/* =========================================================
   범위 버튼 만들기
   ========================================================= */

const rangeGrid = document.getElementById('range-grid');

for (let i = 0; i < 10; i++) {

    const start = i * 10 + 1;

    const end = (i + 1) * 10;

    const btn = document.createElement('button');

    btn.type = 'button';

    btn.className =
        selectedRanges.has(i)
        ? 'range-btn p-2 border-2 rounded-lg text-xs font-bold text-center transition border-indigo-600 bg-indigo-50 text-indigo-900'
        : 'range-btn p-2 border-2 rounded-lg text-xs font-bold text-center transition border-slate-200 text-slate-700 hover:border-slate-300';

    btn.innerText = `${start}~${end}`;

    btn.onclick = () => selectRange(i);

    rangeGrid.appendChild(btn);
}


updateSelectedRangeText();



/* =========================================================
   범위 선택
   여러 개 동시 선택 가능
   ========================================================= */

function selectRange(index) {

    if (selectedRanges.has(index)) {

        // 최소 하나는 선택되어 있어야 함
        if (selectedRanges.size === 1) {
            return;
        }

        selectedRanges.delete(index);

    } else {

        selectedRanges.add(index);

    }


    document
        .querySelectorAll('.range-btn')
        .forEach((btn, idx) => {

            if (selectedRanges.has(idx)) {

                btn.className =
                    'range-btn p-2 border-2 rounded-lg text-xs font-bold text-center transition border-indigo-600 bg-indigo-50 text-indigo-900';

            } else {

                btn.className =
                    'range-btn p-2 border-2 rounded-lg text-xs font-bold text-center transition border-slate-200 text-slate-700 hover:border-slate-300';

            }

        });


    updateSelectedRangeText();
}



/* =========================================================
   선택 범위 표시
   ========================================================= */

function updateSelectedRangeText() {

    const ranges = [...selectedRanges]
        .sort((a, b) => a - b)
        .map(index => {

            const start = index * 10 + 1;

            const end = (index + 1) * 10;

            return `${start}~${end}`;

        });


    document.getElementById('selected-range-text').innerText =
        `선택 범위: ${ranges.join(', ')}`;
}



/* =========================================================
   배열 섞기
   ========================================================= */

function shuffleArray(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
            [arr[j], arr[i]];

    }

    return arr;
}



/* =========================================================
   퀴즈 시작
   ========================================================= */

function startQuiz() {

    let questions = [];


    // 선택된 모든 범위의 문제를 합친다.
    [...selectedRanges]
        .sort((a, b) => a - b)
        .forEach(rangeIndex => {

            const start =
                rangeIndex * 10;

            const rangeQuestions =
                idiomsData.slice(
                    start,
                    start + 10
                );

            questions.push(
                ...rangeQuestions
            );

        });


    // 전체 문제 랜덤
    activeQuestions =
        shuffleArray(questions);


    currentIndex = 0;

    score = 0;


    document
        .getElementById('setup-section')
        .classList.add('hidden');

    document
        .getElementById('result-section')
        .classList.add('hidden');

    document
        .getElementById('quiz-section')
        .classList.remove('hidden');


    document
        .getElementById('mode-hint')
        .innerText =
        '고사성어를 보고 독음(예: 고진감래)을 입력하세요.';


    showQuestion();

}



/* =========================================================
   문제 표시
   ========================================================= */

function showQuestion() {

    const q =
        activeQuestions[currentIndex];


    document
        .getElementById('hanzi-display')
        .innerText =
        q.hanzi;


    document
        .getElementById('progress-text')
        .innerText =
        `문제 ${currentIndex + 1} / ${activeQuestions.length}`;


    document
        .getElementById('score-text')
        .innerText =
        `점수: ${score}점`;


    // 의미 숨기기
    document
        .getElementById('meaning-hint-box')
        .classList.add('hidden');


    // 입력창 초기화
    const input =
        document.getElementById('answer-input');

    input.value = '';

    input.disabled = false;


    // 새 문제에서는 확인 상태 해제
    isAnswerChecked = false;


    // 피드백 초기화
    const feedback =
        document.getElementById('feedback');

    feedback.innerText = '';

    feedback.className =
        'h-8 flex items-center justify-center font-bold text-sm rounded-lg';


    // 버튼 초기화
    const actionBtn =
        document.getElementById('action-btn');

    actionBtn.innerText = '확인';

    actionBtn.className =
        'bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl transition text-base whitespace-nowrap min-w-[90px]';


    /*
       iPad에서 키보드가 유지되도록
       문제 표시 직후 입력창에 포커스
    */

    setTimeout(() => {

        input.focus();

    }, 50);

}



/* =========================================================
   문자열 정리
   ========================================================= */

function cleanString(str) {

    return str
        .replace(/\s+/g, '')
        .trim();

}



/* =========================================================
   확인 / 다음
   ========================================================= */

function handleAction() {

    if (!isAnswerChecked) {

        checkAnswer();

    } else {

        if (
            currentIndex <
            activeQuestions.length - 1
        ) {

            currentIndex++;

            showQuestion();

        } else {

            showResult();

        }

    }

}



/* =========================================================
   정답 확인
   ========================================================= */

function checkAnswer() {

    const input =
        document.getElementById('answer-input');


    // 빈 답안이면 아무것도 하지 않음
    if (input.value.trim() === '') {

        input.focus();

        return;

    }


    const userAns =
        cleanString(input.value);


    const q =
        activeQuestions[currentIndex];


    // 항상 독음만 정답
    const targetAns =
        cleanString(q.reading);


    const feedback =
        document.getElementById('feedback');


    /*
       중요:
       여기서 input.disabled = true를 하지 않는다.

       그래서 정답을 확인한 뒤에도
       iPad 키보드가 내려가지 않는다.
    */


    if (userAns === targetAns) {

        score += 10;


        feedback.innerText =
            '정답입니다! 👏';


        feedback.className =
            'h-8 flex items-center justify-center font-bold text-sm rounded-lg bg-emerald-50 text-emerald-600';

    } else {

        feedback.innerText =
            `오답! 정답: [ ${q.reading} ]`;


        feedback.className =
            'h-8 flex items-center justify-center font-bold text-sm rounded-lg bg-rose-50 text-rose-600';

    }


    // 의미 표시
    const hintBox =
        document.getElementById('meaning-hint-box');


    document
        .getElementById('meaning-hint-text')
        .innerText =
        `[의미] ${q.meaning}`;


    hintBox.classList.remove('hidden');


    // 점수
    document
        .getElementById('score-text')
        .innerText =
        `점수: ${score}점`;


    isAnswerChecked = true;


    // 버튼을 다음 버튼으로 변경
    const actionBtn =
        document.getElementById('action-btn');


    if (
        currentIndex <
        activeQuestions.length - 1
    ) {

        actionBtn.innerText =
            '다음 →';

    } else {

        actionBtn.innerText =
            '결과 보기';

    }


    actionBtn.className =
        'bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2.5 rounded-xl transition text-base whitespace-nowrap min-w-[90px]';


    /*
       핵심:
       정답 확인 직후에도 입력창에 포커스를 유지한다.
       따라서 Enter를 한 번 더 누르면 다음 문제로 넘어간다.
    */

    setTimeout(() => {

        input.focus();

    }, 50);

}



/* =========================================================
   Enter 키
   ========================================================= */

document
    .getElementById('answer-input')
    .addEventListener('keydown', function(e) {

        if (e.key === 'Enter') {

            /*
               iPad/Safari에서 Enter 때문에
               키보드가 내려가는 기본 동작 방지
            */

            e.preventDefault();

            e.stopPropagation();


            handleAction();


            /*
               다시 포커스
            */

            setTimeout(() => {

                this.focus();

            }, 50);

        }

    });



/* =========================================================
   결과
   ========================================================= */

function showResult() {

    document
        .getElementById('quiz-section')
        .classList.add('hidden');


    document
        .getElementById('result-section')
        .classList.remove('hidden');


    const totalScore =
        activeQuestions.length * 10;


    document
        .getElementById('final-score')
        .innerText =
        `${score} / ${totalScore}점`;


    const percentage =
        totalScore > 0
        ? (score / totalScore) * 100
        : 0;


    let msg =
        '수고하셨습니다!';


    if (percentage === 100) {

        msg =
            '완벽합니다! 만점입니다! 🎉';

    } else if (percentage >= 80) {

        msg =
            '훌륭한 성적입니다! 👍';

    } else if (percentage >= 50) {

        msg =
            '조금만 더 연습해 보세요! 💪';

    } else {

        msg =
            '다시 한번 복습해 보세요!';

    }


    document
        .getElementById('result-message')
        .innerText =
        msg;

}



/* =========================================================
   처음으로
   ========================================================= */

function resetSetup() {

    document
        .getElementById('quiz-section')
        .classList.add('hidden');


    document
        .getElementById('result-section')
        .classList.add('hidden');


    document
        .getElementById('setup-section')
        .classList.remove('hidden');


    /*
       다시 설정 화면으로 돌아와도
       기존 범위 선택은 유지한다.
    */

    updateSelectedRangeText();

}


</script>

</html>
